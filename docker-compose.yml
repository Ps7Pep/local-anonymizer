# ── Datathon Anonymizer ───────────────────────────────────────────────────────
# Opció A — Imatge pre-construïda (recomanada, no requereix internet)
#   docker compose up -d
#
# Opció B — Construir localment des del codi font (requereix internet)
#   docker compose up --build -d
#
# Entorn sense internet (SERGAS, etc.):
#   Des d'un equip amb internet:
#     docker pull ghcr.io/ps7pep/local-anonymizer:latest
#     docker save ghcr.io/ps7pep/local-anonymizer:latest -o local-anonymizer.tar
#   Al servidor sense internet:
#     docker load -i local-anonymizer.tar
#     docker compose up -d
#
# Accés: per defecte només des de la mateixa màquina (http://localhost:8092).
# Si l'eina corre en un servidor i s'hi accedeix des d'un altre equip, canvia
# "127.0.0.1:8092:8000" per "8092:8000" — deliberadament, i només en una xarxa
# interna de confiança: l'app no té autenticació.

services:
  anonymizer:
    image: ghcr.io/ps7pep/local-anonymizer:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local-anonymizer
    ports:
      - "127.0.0.1:8092:8000"
    volumes:
      - ./sample_data:/app/sample_data:ro
    environment:
      - PYTHONUNBUFFERED=1
      # Minuts d'inactivitat abans d'esborrar una sessió de la memòria
      - SESSION_TTL_MINUTES=120
    restart: unless-stopped
